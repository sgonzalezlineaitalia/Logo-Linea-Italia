<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de trabajador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1C2321;
    font-family:'IBM Plex Sans',sans-serif;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:#FAFAF7;
    border:3px solid #1C2321;
    padding:28px 24px 24px;
    text-align:center;
  }
  .logo-wrap{
    margin-bottom:18px;
  }
  .logo-wrap img{
    max-width:100%;
    max-height:140px;
  }
  .nombre{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:24px;
    color:#1C2321;
    line-height:1.15;
    margin-bottom:10px;
  }
  .dato{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:15px;
    color:#B87E00;
    margin-bottom:4px;
  }
  .puesto{
    font-size:14px;
    color:#6B6F6D;
    margin-top:6px;
  }
  .estado{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid #D8D5CC;
    font-size:13px;
    color:#6B6F6D;
  }
  .error{
    font-size:15px;
    color:#6B6F6D;
    line-height:1.5;
  }
</style>
</head>
